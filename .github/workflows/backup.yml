# Backup diário, fora da Vercel e do Neon (regra 3-2-1): banco (pg_dump) e arquivos (cópia
# incremental do Blob), cifrados com a chave pública age antes de sair daqui.
# Configuração e restauração: README, seção "Backup".
# Sem os segredos configurados o job só avisa e termina — não falha todo dia.
name: Backup

on:
  schedule:
    - cron: "0 5 * * *" # 02h em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CONFIGURADO: ${{ secrets.BACKUP_AGE_RECIPIENT != '' && secrets.BACKUP_DATABASE_URL != '' && (secrets.BACKUP_S3_BUCKET != '') }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Segredos ausentes
        if: env.CONFIGURADO != 'true'
        run: echo "::warning::Backup não configurado (faltam segredos BACKUP_*). Veja a seção Backup do README."

      - uses: actions/checkout@v4
        if: env.CONFIGURADO == 'true'
      - uses: actions/setup-node@v4
        if: env.CONFIGURADO == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Dependências
        if: env.CONFIGURADO == 'true'
        run: npm ci --ignore-scripts

      # pg_dump precisa ser da mesma versão principal do servidor ou mais nova.
      - name: Cliente do PostgreSQL 18
        if: env.CONFIGURADO == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Banco
        if: env.CONFIGURADO == 'true'
        run: node scripts/backup/backup.mjs banco
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}

      - name: Arquivos
        if: env.CONFIGURADO == 'true' && !cancelled()
        run: node scripts/backup/backup.mjs arquivos
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
